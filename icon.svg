<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#3a6fb5"/>
  <rect y="11" width="16" height="5" fill="#d9a53a"/>
  <!-- A galloping horse, in pixels. -->
  <g fill="#7a3f1d">
    <rect x="11" y="3" width="2" height="1"/>
    <rect x="10" y="4" width="4" height="1"/>
    <rect x="10" y="5" width="2" height="1"/>
    <rect x="4" y="6" width="8" height="1"/>
    <rect x="3" y="7" width="8" height="2"/>
    <rect x="2" y="9" width="2" height="2"/>
    <rect x="9" y="9" width="2" height="1"/>
    <rect x="11" y="10" width="2" height="1"/>
    <rect x="4" y="9" width="1" height="2"/>
  </g>
  <rect x="2" y="6" width="2" height="1" fill="#2b1a10"/>
  <rect x="12" y="4" width="1" height="1" fill="#2b1a10"/>
  <!-- The rider's red hat. -->
  <rect x="7" y="3" width="2" height="1" fill="#b3263a"/>
  <rect x="7" y="4" width="2" height="2" fill="#2e7d4f"/>
</svg>
